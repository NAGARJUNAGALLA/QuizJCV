<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1, user-scalable=no ">
<title>FLN Score Card</title>

<style>
body{font-family:Arial;margin:0;background:#f7f7f7;}
.header{padding:15px;font-size:22px;font-weight:bold;background:#fff;
border-bottom:2px solid #ddd;text-align:center;}
.card{background:#fff;margin:15px;padding:15px;border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.title-row{display:flex;justify-content:space-between;
background:#efc27d;padding:12px;border-radius:10px;font-weight:bold;}
.row-3col{display:flex;justify-content:space-between;align-items:center;
padding:15px 5px;}
.label-btn{padding:15px;width:45%;text-align:center;color:white;border-radius:10px;
font-size:18px;font-weight:bold;}
.num-box{font-size:22px;font-weight:bold;}
.sky{background:#1fcfaa;}
.mountain{background:#ff8146;}
.stream{background:#e32020;}

.student-row{background:#fff;display:flex;justify-content:space-between;
align-items:center;padding:12px;margin:10px 0;border-radius:12px;
box-shadow:0 1px 4px rgba(0,0,0,0.15);}
.stud-name{font-weight:bold;font-size:16px;}
.stud-id{font-size:13px;color:#555;}
.score-box{padding: 12px;border-radius:0px 10px 10px 0px;font-weight:bold;color:#fff;}
.back-btn{padding:10px 15px;font-size:18px;cursor:pointer;}
.hide{display:none;}
    .topbar{
    background:#3F51B5;
    color:white;
    padding:15px;
    font-size:20px;
    display:flex;
    align-items:center;
}

.menu-btn{
    font-size:26px;
    margin-right:20px;
    cursor:pointer;
}

.top-title{
    flex:1;
}

/* SIDE NAV */
.sidenav{
    height:100%;
    width:0;
    position:fixed;
    z-index:10;
    top:0;
    left:0;
    background:#3F51B5;
    padding-top:60px;
    overflow-x:hidden;
    transition:0.4s;
}

.sidenav a{
    padding:12px 25px;
    text-decoration:none;
    color:white;
    display:block;
    font-size:18px;
}

.sidenav a:hover{
    background:#303F9F;
}

.closebtn{
    position:absolute;
    top:10px;
    right:20px;
    font-size:30px;
    cursor:pointer;
    /* FIXED BOTTOM NAV BAR */
.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#3F51B5;
    color:white;
    text-align:center;
    padding:12px 0;
    font-size:16px;
    z-index:20;
    box-shadow:0 -2px 5px rgba(0,0,0,0.2);
}
</style>
</head>

<body>
<div class="topbar">
    <span class="menu-btn" onclick="openNav()">&#9776;</span>
    <span class="top-title">Home</span>
</div>

<!-- SIDE NAVIGATION -->
<div id="sideNav" class="sidenav">
    <span class="closebtn" onclick="closeNav()">&times;</span>

    <a href="student-profile.html">Student Profile</a>
    <a href="attendance.html">Student Attendance</a>
    <a href="marks.html">Student Marks</a>
    <a href="exam-schedule.html">Exam Schedule</a>
    <a href="material.html">Material</a>
    <a href="fln.html">G FLN</a>
</div>
<!-- ================== PAGE 1 ================== -->
<div id="page1">
    <div class="header">FLN Score Card</div>

    <!-- TELUGU BLOCK -->
    <div class="card" onclick="openSubject('Telugu')">
        <div class="title-row">
            <span>Class - 4(9)</span>
            <span>Telugu</span>
        </div>

        <div class="row-3col">
            <div class="label-btn sky">Sky</div>
            <div class="num-box">6</div>
        </div>

        <div class="row-3col">
            <div class="label-btn mountain">Mountain</div>
            <div class="num-box">1</div>
        </div>

        <div class="row-3col">
            <div class="label-btn stream">Stream</div>
            <div class="num-box">2</div>
        </div>
    </div>


    <!-- ENGLISH BLOCK -->
    <div class="card" onclick="openSubject('English')">
        <div class="title-row">
            <span>Class - 4(9)</span>
            <span>English</span>
        </div>

        <div class="row-3col">
            <div class="label-btn sky">Sky</div>
            <div class="num-box">5</div>
        </div>

        <div class="row-3col">
            <div class="label-btn mountain">Mountain</div>
            <div class="num-box">2</div>
        </div>

        <div class="row-3col">
            <div class="label-btn stream">Stream</div>
            <div class="num-box">2</div>
        </div>
    </div>


    <!-- MATHS BLOCK -->
    <div class="card" onclick="openSubject('Maths')">
        <div class="title-row">
            <span>Class - 4(9)</span>
            <span>Maths</span>
        </div>

        <div class="row-3col">
            <div class="label-btn sky">Sky</div>
            <div class="num-box">7</div>
        </div>

        <div class="row-3col">
            <div class="label-btn mountain">Mountain</div>
            <div class="num-box">1</div>
        </div>

        <div class="row-3col">
            <div class="label-btn stream">Stream</div>
            <div class="num-box">1</div>
        </div>
    </div>

</div>


<!-- ================== PAGE 2 ================== -->
<div id="page2" class="hide">

    <div class="header">
        <span class="back-btn" onclick="goBack()">⬅</span>
        FLN Score Card
    </div>

    <div class="card">
        <div class="title-row">
            <span>Class - 4</span>
            <span id="subjectTitle"></span>
        </div>

        <div id="studentList"></div>
    </div>
</div>
<!-- FIXED BOTTOM NAVIGATION -->
<div class="bottom-bar">
    Powered By JCV Tuition Centre
</div>
<script>
// Student data for Page 2
const data = {

        {name:"FARZANA KHAN", id:"3000956843", score:46},

        {name:"RAYAVARAPU ANAND BABU", id:"3001004695", score:42},
        {name:"SALA YASASWINI", id:"3000956596", score:26}
    ],

        {name:"SALA YASASWINI", id:"3000956596", score:38}
    ]
};

// Open subject
function openSubject(sub){
    document.getElementById("page1").classList.add("hide");
    document.getElementById("page2").classList.remove("hide");

    document.getElementById("subjectTitle").innerText = sub;

    let list = "";
    data[sub].forEach(s=>{
        let color = s.score >= 36 ? "#1fcfaa" : s.score >= 21 ? "#ff8146" : "#e32020";
        list += `
        <div class="student-row">
            <div>
                <div class="stud-name">${s.name}</div>
                <div class="stud-id">ID : ${s.id}</div>
            </div>
            <div class="score-box" style="background:${color}">${s.score}</div>
        </div>`;
    });
    document.getElementById("studentList").innerHTML = list;
}

// Back
function goBack(){
    document.getElementById("page2").classList.add("hide");
    document.getElementById("page1").classList.remove("hide");
}
    function openNav(){
    document.getElementById("sideNav").style.width = "250px";
}
function closeNav(){
    document.getElementById("sideNav").style.width = "0";
}
</script>

</body>
</html>
