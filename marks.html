<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Marks Cards</title>

<style>
    body{
        font-family: Arial, sans-serif;
        margin: 10px;
        background: #f7f7f7;
    }

    .schedule-card{
        background: #fff;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 15px;

        /* ⭐ Gradient border */
        border: 4px solid transparent;
        background-image:
            linear-gradient(#fff, #fff),
            linear-gradient(45deg, #ff9a9e, #fad0c4, #ffd580,
                             #a8edea, #d4fc79, #96e6a1);
        background-origin: border-box;
        background-clip: padding-box, border-box;

        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .student-name{
        font-size: 20px;
        font-weight: bold;
        color: #e63946;
        margin-bottom: 15px;
        text-align: center;
    }

    table{
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
        font-size: 13px;
        table-layout: fixed;   /* fits card width */
    }

    th, td{
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
        word-wrap: break-word;
        font-size: 13px;
    }

    th{
        background: #d0eaff;
        font-weight: bold;
    }
  /* ⭐ Increase Subject column width */
td:first-child,
th:first-child{
    width: 24%;   /* You can increase to 30–32% if needed */
}

</style>

</head>
<body>

<!-- ⭐ STUDENT CARD 1 -->
<div class="schedule-card">
    <div class="student-name">Student: RAMESH</div>

    <table>
        <tr>
            <th>Subject</th>
            <th>FA1</th>
            <th>FA2</th>
            <th>SA1</th>
            <th>FA3</th>
            <th>FA4</th>
            <th>SA2</th>
        </tr>

        <tr>
            <td>Telugu</td>
            <td>36</td>
            <td>45</td>
            <td>63</td>
            <td>35</td>
            <td>45</td>
            <td>-</td>
        </tr>

        <tr>
            <td>English</td>
            <td>36</td>
            <td>47</td>
            <td>54</td>
            <td>23</td>
            <td>38</td>
            <td>-</td>
        </tr>

        <tr>
            <td>Maths</td>
            <td>36</td>
            <td>47</td>
            <td>54</td>
            <td>23</td>
            <td>38</td>
            <td>-</td>
        </tr>

        <tr>
            <td>EVS</td>
            <td>36</td>
            <td>47</td>
            <td>54</td>
            <td>23</td>
            <td>38</td>
            <td>-</td>
        </tr>
    </table>
</div>
<!-- END CARD -->
