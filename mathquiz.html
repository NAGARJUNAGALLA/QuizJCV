<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Subject Tests</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding-top:56px; /* header height */
/* Disable text selection */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;

    /* Disable long press menu */
    -webkit-touch-callout: none;
  
}

/* Fixed Header */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:56px;
    background:#0d6efd;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    z-index:1000;
}

/* Home Button */
.home-btn{
    position:absolute;
    left:15px;
    font-size:20px;
    cursor:pointer;
}

/* Container */
.container{
    padding:15px;
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

th, td{
    padding:12px 8px;
    text-align:center;
    font-size:14px;
}

th{
    background:#f1f3f5;
    font-weight:bold;
}

/* Test Button */
.test-btn{
    background:#0d6efd;
    color:#fff;
    padding:8px 14px;
    border-radius:20px;
    text-decoration:none;
    font-size:13px;
    display:inline-block;
}
.test-btn:active{
    opacity:0.8;
}
</style>
</head>

<body>

<!-- Fixed Header -->
<div class="header">
    <div class="home-btn" onclick="goHome()">🏠</div>
    Subject Tests
</div>

<div class="container">

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Topic Name</th>
            <th>Test</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>01-08-2025</td>
            <td>Light – Reflection</td>
            <td>
                <a class="test-btn" href="light_test1.html">Start</a>
            </td>
        </tr>

        <tr>
            <td>05-08-2025</td>
            <td>Refraction</td>
            <td>
                <a class="test-btn" href="light_test2.html">Start</a>
            </td>
        </tr>

        <tr>
            <td>10-08-2025</td>
            <td>Electricity – Ohm’s Law</td>
            <td>
                <a class="test-btn" href="electricity_test1.html">Start</a>
            </td>
        </tr>

        <tr>
            <td>15-08-2025</td>
            <td>Magnetism</td>
            <td>
                <a class="test-btn" href="magnetism_test1.html">Start</a>
            </td>
        </tr>
    </tbody>
</table>

</div>

<script>
function goHome(){
    window.location.href = "index.html";
}
  // Disable double tap zoom (mobile)
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
    let now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
        event.preventDefault();
    }
    lastTouchEnd = now;
}, false);

</script>

</body>
</html>
