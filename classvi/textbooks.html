<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCV CLASS VI TEXTBOOKS</title>
<style>
 body{
   margin:0;
   font-family:Arial;
   background:#f3f4f6;
 }
 header{
   background:linear-gradient(45deg,#1e3e8e,#0f2a6b);
   color:white;
   padding:15px;
   text-align:center;
   font-size:22px;
   font-weight:bold;
 }
 .container{
   padding:15px;
 }
 .subject{
   background:linear-gradient(45deg,#1e3e8e,#0f2a6b);
   color:white;
   padding:12px;
   border-radius:10px;
   margin-bottom:10px;
   font-size:18px;
   text-align:center;
   cursor:pointer;
 }
 .chapters{
   display:none;
   background:white;
   padding:10px;
   margin-top:5px;
   border-radius:10px;
 }
 .chapters a{
   display:block;
   padding:8px;
   background:#e6e9f0;
   margin:5px 0;
   border-radius:6px;
   text-decoration:none;
   color:#1e3e8e;
   font-weight:bold;
 }
</style>
</head>
<body>
<header>JCV CLASS VI TEXTBOOKS</header>

<div class="container">

  <div class="subject" onclick="toggleChapters('telugu')">TELUGU</div>
  <div id="telugu" class="chapters">
    <a href="https://drive.google.com/viewerng/viewer?embedded=true&url=https://github.com/NAGARJUNAGALLA/Video/raw/main/telugulesson41.pdf" target="_blank">Telugu Lesson 41</a>
  </div>

  <div class="subject" onclick="toggleChapters('english')">ENGLISH</div>
  <div id="english" class="chapters">
    <a href="#" target="_blank">Unit 1</a>
  </div>

  <div class="subject" onclick="toggleChapters('maths')">MATHS</div>
  <div id="maths" class="chapters">
    <a href="#" target="_blank">Chapter 1</a>
  </div>

  <div class="subject" onclick="toggleChapters('science')">SCIENCE</div>
  <div id="science" class="chapters">
    <a href="#" target="_blank">Chapter 1</a>
  </div>

  <div class="subject" onclick="toggleChapters('social')">SOCIAL</div>
  <div id="social" class="chapters">
    <a href="#" target="_blank">Chapter 1</a>
  </div>

  <div class="subject" onclick="toggleChapters('hindi')">HINDI</div>
  <div id="hindi" class="chapters">
    <a href="#" target="_blank">Chapter 1</a>
  </div>

</div>

<script>
function toggleChapters(id){
  var box=document.getElementById(id);
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}
</script>

</body>
</html>
