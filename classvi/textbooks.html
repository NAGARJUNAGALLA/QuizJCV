<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCV CLASS VI TEXTBOOKS</title>
<style>
 body{
   margin:0;
   font-family:Arial;
   background:#f3f4f6;
 }
 header{
   background:linear-gradient(45deg,#1e3e8e,#0f2a6b);
   color:white;
   padding:15px;
   text-align:center;
   font-size:22px;
   font-weight:bold;
 }
 .container{
   padding:15px;
 }
 .subject{
   background:linear-gradient(45deg,#1e3e8e,#0f2a6b);
   color:white;
   padding:12px;
   border-radius:10px;
   margin-bottom:10px;
   font-size:18px;
   text-align:center;
   cursor:pointer;
 }
 .chapters{
   display:none;
   background:white;
   padding:10px;
   margin-top:5px;
   border-radius:10px;
 }
 .chapters a{
   display:block;
   padding:8px;
   background:#e6e9f0;
   margin:5px 0;
   border-radius:6px;
   text-decoration:none;
   color:#1e3e8e;
   font-weight:bold;
 }
 #pdfViewerBox{
   position:fixed;
   top:0;
   left:0;
   width:100%;
   height:100%;
   background:rgba(0,0,0,0.8);
   display:none;
   justify-content:center;
   align-items:center;
 }
 #pdfViewer{
   width:90%;
   height:85%;
   border:2px solid white;
 }
 #closePdf{
   position:absolute;
   top:20px;
   right:20px;
   background:red;
   color:white;
   padding:10px 15px;
   font-size:18px;
   border-radius:8px;
 }
</style>
</head>
<body>
<header>JCV CLASS VI TEXTBOOKS</header>

<div class="container">

  <div class="subject" onclick="toggleChapters('telugu')">TELUGU</div>
  <div id="telugu" class="chapters">
    <a href="#" onclick="openPdf('https://github.com/NAGARJUNAGALLA/Video/raw/main/telugulesson41.pdf')">1) గాంధీ మహాత్ముడు</a>
   <a href="#" onclick="openPdf('https://github.com/NAGARJUNAGALLA/Video/raw/main/telugulesson42.pdf')">2) గోపాల్ తెలివి</a>
   <a href="#" onclick="openPdf('https://github.com/NAGARJUNAGALLA/Video/raw/main/telugulesson43.pdf')">3) గాంధీ మహాత్ముడు</a>
  </div>

  <div class="subject" onclick="toggleChapters('english')">ENGLISH</div>
  <div id="english" class="chapters">
    <a href="#" onclick="openPdf('https://github.com/NAGARJUNAGALLA/Video/raw/main/english1.pdf')">Unit 1</a>
  </div>

  <div class="subject" onclick="toggleChapters('maths')">MATHS</div>
  <div id="maths" class="chapters">
    <a href="#" onclick="openPdf('https://github.com/NAGARJUNAGALLA/Video/raw/main/maths1.pdf')">Chapter 1</a>
  </div>

  <div class="subject" onclick="toggleChapters('science')">SCIENCE</div>
  <div id="science" class="chapters">
    <a href="#" onclick="openPdf('https://github.com/NAGARJUNAGALLA/Video/raw/main/science1.pdf')">Chapter 1</a>
  </div>

  <div class="subject" onclick="toggleChapters('social')">SOCIAL</div>
  <div id="social" class="chapters">
    <a href="#" onclick="openPdf('https://github.com/NAGARJUNAGALLA/Video/raw/main/social1.pdf')">Chapter 1</a>
  </div>

  <div class="subject" onclick="toggleChapters('hindi')">HINDI</div>
  <div id="hindi" class="chapters">
    <a href="#" onclick="openPdf('https://github.com/NAGARJUNAGALLA/Video/raw/main/hindi1.pdf')">Chapter 1</a>
  </div>

</div>

<div id="pdfViewerBox">
  <button id="closePdf" onclick="closePdf()">CLOSE</button>
  <iframe id="pdfViewer"></iframe>
</div>

<script>
function toggleChapters(id){
  var box=document.getElementById(id);
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

function openPdf(link){
  const viewerLink = 'https://drive.google.com/viewerng/viewer?embedded=true&url=' + encodeURIComponent(link);
  document.getElementById('pdfViewer').src = viewerLink;
  document.getElementById('pdfViewerBox').style.display='flex';
}

function closePdf(){
  document.getElementById('pdfViewerBox').style.display='none';
  document.getElementById('pdfViewer').src='';
}
</script>

</body>
</html>
