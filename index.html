<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1, user-scalable=no">
<title>Dashboard</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#ffffff;
}

/* TOP BAR */
.topbar{
    background:#3F51B5;
    color:white;
    padding:15px;
    font-size:20px;
    display:flex;
    align-items:center;
}

.menu-btn{
    font-size:26px;
    margin-right:20px;
    cursor:pointer;
}

.top-title{
    flex:1;
}

/* SIDE NAV */
.sidenav{
    height:100%;
    width:0;
    position:fixed;
    z-index:10;
    top:0;
    left:0;
    background:#3F51B5;
    padding-top:60px;
    overflow-x:hidden;
    transition:0.4s;
}

.sidenav a{
    padding:12px 25px;
    text-decoration:none;
    color:white;
    display:block;
    font-size:18px;
}

.sidenav a:hover{
    background:#303F9F;
}

.closebtn{
    position:absolute;
    top:10px;
    right:20px;
    font-size:30px;
    cursor:pointer;
}

/* GRID BLOCKS */
.grid-container{
    margin:20px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    text-align:center;
}

.block{
    padding:15px;
    cursor:pointer;
}

.block img{
    width:70px;
    height:70px;
}

.block-text{
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
}

/* FIXED BOTTOM NAV BAR */
.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#3F51B5;
    color:white;
    text-align:center;
    padding:12px 0;
    font-size:16px;
    z-index:20;
    box-shadow:0 -2px 5px rgba(0,0,0,0.2);
}
</style>

<script>
function openNav(){
    document.getElementById("sideNav").style.width = "250px";
}
function closeNav(){
    document.getElementById("sideNav").style.width = "0";
}
</script>

</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <span class="menu-btn" onclick="openNav()">&#9776;</span>
    <span class="top-title">Home</span>
</div>

<!-- SIDE NAVIGATION -->
<div id="sideNav" class="sidenav">
    <span class="closebtn" onclick="closeNav()">&times;</span>

    <a href="student-profile.html">Student Profile</a>
    <a href="attendance.html">Student Attendance</a>
    <a href="marks.html">Student Marks</a>
    <a href="exam-schedule.html">Exam Schedule</a>
    <a href="material.html">Material</a>
    <a href="fln.html">G FLN</a>
</div>

<!-- DASHBOARD GRID -->
<div class="grid-container">

    <div class="block" onclick="location.href='student-profile.html'">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135768.png">
        <div class="block-text">Student Profile</div>
    </div>

    <div class="block" onclick="location.href='attendance.html'">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">
        <div class="block-text">Student Attendance</div>
    </div>

    <div class="block" onclick="location.href='marks.html'">
        <img src="https://cdn-icons-png.flaticon.com/512/4727/4727424.png">
        <div class="block-text">Student Marks</div>
    </div>

    <div class="block" onclick="location.href='exam-schedule.html'">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png">
        <div class="block-text">Exam Schedule</div>
    </div>

    <div class="block" onclick="location.href='material.html'">
        <img src="https://cdn-icons-png.flaticon.com/512/2995/2995620.png">
        <div class="block-text">Material</div>
    </div>
    <div class="block" onclick="location.href='fln.html'">
        <img src="https://cdn-icons-png.flaticon.com/512/2995/2995620.png">
        <div class="block-text">G FLN</div>
    </div>

</div>

<!-- FIXED BOTTOM NAVIGATION -->
<div class="bottom-bar">
    Powered By JCV Tuition Centre
</div>

</body>
</html>
