<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login / Signup</title>
<style>
body{
  font-family:Arial;
  background:#f7f9fc;
  margin:0;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  width:100%;
  max-width:380px;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
}
h2{text-align:center;color:#003A8C;margin-bottom:20px;}
label{margin-top:12px;display:block;}
input{width:100%;padding:10px;border:1px solid #cbd2dd;border-radius:6px;margin-top:6px;}
button{width:100%;padding:12px;background:#003A8C;color:#fff;border:0;border-radius:8px;margin-top:16px;font-size:17px;cursor:pointer;}
.links{text-align:center;margin-top:12px;}
.links a{color:#003A8C;font-weight:bold;cursor:pointer;}
.msg{text-align:center;margin-top:10px;color:red;font-size:14px;}
.success{color:green;}
</style>
</head>

<body>

<div class="card">

<!-- LOGIN -->
<div id="loginView">
<h2>Login</h2>

<label>Mobile Number</label>
<input id="loginMobile" type="text">

<label>Password</label>
<input id="loginPassword" type="password">

<button id="btnLogin">Login</button>
<div id="loginMsg" class="msg"></div>

<div class="links">
<a onclick="showSignup()">Sign Up</a> | 
<a onclick="showForgot()">Forgot Password?</a>
</div>
</div>

<!-- SIGNUP -->
<div id="signupView" style="display:none;">
<h2>Sign Up</h2>

<label>Name</label>
<input id="suName" type="text">

<label>Mobile</label>
<input id="suMobile" type="text">

<label>Password</label>
<input id="suPassword" type="password">

<button id="btnSignup">Create Account</button>
<div id="signupMsg" class="msg"></div>

<div class="links"><a onclick="showLogin()">Back to Login</a></div>
</div>

<!-- FORGOT -->
<div id="forgotView" style="display:none;">
<h2>Recover Password</h2>

<label>Registered Mobile</label>
<input id="fpMobile" type="text">

<button id="btnRecover">Get Password</button>
<div id="forgotMsg" class="msg"></div>

<div class="links"><a onclick="showLogin()">Back to Login</a></div>
</div>

</div>

<script>
// =========================================
// 🔴 CONFIGURE THESE VALUES
// =========================================

// Google Form POST URL (ends with /formResponse)
const FORM_URL = "PASTE_FORM_RESPONSE_URL_HERE";

// Google Form entry IDs
const ENTRY_NAME = "entry.111111";
const ENTRY_MOBILE = "entry.222222";
const ENTRY_PASSWORD = "entry.333333";

// =========================================
// LOCAL LOGIN DATA (works in App Inventor)
// =========================================
const loginData = [
  {"Name":"John Doe","Mobile":"6301186741","Password":"Jaya24@12"},
  {"Name":"Jane Smith","Mobile":"9876543210","Password":"jane123"}
];

// =========================================
// VIEW SWITCH
// =========================================
function showLogin(){
  loginView.style.display = "block";
  signupView.style.display = "none";
  forgotView.style.display = "none";
}
function showSignup(){
  signupView.style.display = "block";
  loginView.style.display = "none";
  forgotView.style.display = "none";
}
function showForgot(){
  forgotView.style.display = "block";
  loginView.style.display = "none";
  signupView.style.display = "none";
}

// =========================================
// SIGNUP → Google Form
// =========================================
btnSignup.onclick = async () => {
  signupMsg.textContent = "";
  signupMsg.classList.remove("success");

  const name = suName.value.trim();
  const mobile = suMobile.value.trim();
  const password = suPassword.value.trim();

  if(!name || !mobile || !password){
    signupMsg.textContent = "All fields are required";
    return;
  }

  const fd = new FormData();
  fd.append(ENTRY_NAME, name);
  fd.append(ENTRY_MOBILE, mobile);
  fd.append(ENTRY_PASSWORD, password);

  try {
    await fetch(FORM_URL, {method:"POST", mode:"no-cors", body:fd});
    signupMsg.classList.add("success");
    signupMsg.textContent = "Account created! You can login now.";
    suName.value = suMobile.value = suPassword.value = "";
  } catch(e){
    signupMsg.textContent = "Error submitting form. Try again.";
  }
};

// =========================================
// LOGIN → Validate from local loginData
// =========================================
btnLogin.onclick = () => {
  loginMsg.textContent = "";
  loginMsg.classList.remove("success");

  const mobile = loginMobile.value.trim();
  const password = loginPassword.value.trim();

  if(!mobile || !password){
    loginMsg.textContent = "Enter mobile and password";
    return;
  }

  const user = loginData.find(r => r.Mobile === mobile && r.Password === password);

  if(user){
    loginMsg.classList.add("success");
    loginMsg.textContent = "Login successful!";
    localStorage.setItem("user_mobile", mobile);
    setTimeout(()=> location.href="dashboard.html", 600);
  } else {
    loginMsg.textContent = "Incorrect mobile or password";
  }
};

// =========================================
// FORGOT PASSWORD → Validate from local loginData
// =========================================
btnRecover.onclick = () => {
  const mob = fpMobile.value.trim();
  forgotMsg.textContent = "";
  forgotMsg.classList.remove("success");

  if(!mob){
    forgotMsg.textContent = "Enter your mobile";
    return;
  }

  const user = loginData.find(r => r.Mobile === mob);

  if(user){
    forgotMsg.classList.add("success");
    forgotMsg.textContent = "Your password: " + user.Password;
  } else {
    forgotMsg.textContent = "Mobile not found";
  }
};
</script>

</body>
</html>
