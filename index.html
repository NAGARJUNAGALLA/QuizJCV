<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Drawing Board</title>

<style>
    body {
        margin: 0;
        background: #000;
        font-family: Arial;
        overflow: hidden;
    }

    /* Chalkboard */
    #board {
        background: #0d3b20;
        width: 100vw;
        height: calc(100vh - 90px);
        touch-action: none;
        display: block;
    }

    /* Bottom toolbar */
    #toolbar {
        height: 90px;
        background: #1f1f1f;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 5px;
        position: fixed;
        bottom: 0;
        width: 100%;
    }

    .tool {
        width: 55px;
        height: 55px;
        border-radius: 12px;
        background: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 12px;
        flex-direction: column;
    }

    #colorPicker {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 3px solid white;
        background: red;
    }

    button {
        border: none;
        color: white;
        background: #444;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 12px;
    }
</style>
</head>

<body>

<canvas id="board"></canvas>

<div id="toolbar">

    <input type="color" id="colorPicker">

    <div class="tool" onclick="setTool('pen')">Pen</div>
    <div class="tool" onclick="setTool('marker')">Marker</div>
    <div class="tool" onclick="setTool('brush')">Brush</div>
    <div class="tool" onclick="setTool('eraser')">Erase</div>

    <button onclick="clearBoard()">Clear</button>

</div>

<script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 90;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    let drawing = false;
    let tool = "pen";
    let color = "#ffffff";
    let size = 3;

    function setTool(t) {
        tool = t;
        if (t === "pen") size = 3;
        if (t === "marker") size = 8;
        if (t === "brush") size = 15;
        if (t === "eraser") size = 20;
    }

    document.getElementById("colorPicker").oninput = (e) => {
        color = e.target.value;
    };

    function clearBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function getPosition(event) {
        const rect = canvas.getBoundingClientRect(); // exact canvas position
        let x, y;

        if (event.touches) {
            x = event.touches[0].clientX - rect.left;
            y = event.touches[0].clientY - rect.top;
        } else {
            x = event.clientX - rect.left;
            y = event.clientY - rect.top;
        }

        return { x, y };
    }

    function startDrawing(e) {
        drawing = true;
        const pos = getPosition(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    function stopDrawing() {
        drawing = false;
        ctx.beginPath();
    }

    function draw(e) {
        if (!drawing) return;

        const pos = getPosition(e);

        ctx.lineCap = "round";
        ctx.lineWidth = size;

        if (tool === "eraser") {
            ctx.strokeStyle = "#0d3b20";
        } else {
            ctx.strokeStyle = color;
        }

        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);

        e.preventDefault();
    }

    // Mouse events
    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mousemove", draw);

    // Touch events
    canvas.addEventListener("touchstart", startDrawing);
    canvas.addEventListener("touchend", stopDrawing);
    canvas.addEventListener("touchmove", draw);

</script>

</body>
</html>
