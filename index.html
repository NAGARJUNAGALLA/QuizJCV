<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses Dashboard</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f9;
}

/* Header */
.header{
    background:#0d6efd;
    color:#fff;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

/* Tabs */
.tabs{
    display:flex;
    background:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.tab{
    flex:1;
    padding:12px;
    text-align:center;
    cursor:pointer;
    font-weight:bold;
}
.tab.active{
    color:#0d6efd;
    border-bottom:3px solid #0d6efd;
}

/* Course Grid */
.container{
    padding:15px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

/* Card */
.card{
    background:#fff;
    border-radius:12px;
    padding:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    cursor:pointer;
}
.card h3{
    margin:0 0 8px;
    font-size:16px;
}
.card p{
    margin:0;
    font-size:13px;
    color:#666;
}
.free{
    color:green;
    font-weight:bold;
}
.paid{
    color:#d63384;
    font-weight:bold;
}

.lock{
    float:right;
    font-size:16px;
}
</style>
</head>

<body>

<div class="header">JCV ICE</div>

<div class="tabs">
    <div class="tab active" onclick="showCourses('free')">Free Courses</div>
    <div class="tab" onclick="showCourses('paid')">Paid Courses</div>
</div>

<div class="container">

    <!-- Free Courses -->
    <div id="free" class="grid">
        <div class="card" onclick="openCourse('study_material.html')">
            <h3>Study Material</h3>
            <p class="free">FREE</p>
        </div>

        <div class="card" onclick="openCourse('textbooks.html')">
            <h3>Textbooks</h3>
            <p class="free">FREE</p>
        </div>

        <div class="card" onclick="openCourse('free_tests.html')">
            <h3>Free Tests</h3>
            <p class="free">FREE</p>
        </div>
    </div>

    <!-- Paid Courses -->
    <div id="paid" class="grid" style="display:none;">
        <div class="card" onclick="openCourse('quiz_list_1.html')">
            <span class="lock">🔒</span>
            <h3>Maths Test Series</h3>
            <p class="paid">PAID</p>
        </div>

        <div class="card" onclick="openCourse('quiz_list_2.html')">
            <span class="lock">🔒</span>
            <h3>Telugu Test Series</h3>
            <p class="paid">PAID</p>
        </div>

        <div class="card" onclick="openCourse('quiz_list_3.html')">
            <span class="lock">🔒</span>
            <h3>English Test Series</h3>
            <p class="paid">PAID</p>
        </div>

        <div class="card" onclick="openCourse('quiz_list_4.html')">
            <span class="lock">🔒</span>
            <h3>AP DSC SGT TEST SERIES</h3>
            <p class="paid">PAID</p>
        </div>
    </div>

</div>

<script>
function showCourses(type){
    document.getElementById('free').style.display = type === 'free' ? 'grid' : 'none';
    document.getElementById('paid').style.display = type === 'paid' ? 'grid' : 'none';

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
}

function openCourse(page){
    window.location.href = page; 
}
</script>

</body>
</html>
